<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <title>鸡兔同笼 · 数学小挑战</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #26352e;
      --muted: #78837a;
      --paper: #f7f5ef;
      --card: #fffefa;
      --green: #376b50;
      --green-dark: #28523c;
      --green-soft: #e8f0e8;
      --orange: #e89951;
      --line: #e8e7dd;
      --shadow: 0 18px 55px rgba(48, 62, 49, .09);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 10%, rgba(232, 153, 81, .11), transparent 28%),
        radial-gradient(ellipse at 88% 90%, rgba(55, 107, 80, .11), transparent 30%),
        var(--paper);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    }

    button, input { font: inherit; }

    .game {
      width: min(100%, 560px);
      overflow: hidden;
      border: 1px solid rgba(232, 231, 221, .9);
      border-radius: 26px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .top {
      position: relative;
      padding: 28px 34px 25px;
      overflow: hidden;
      color: white;
      background: var(--green);
    }

    .top::after {
      position: absolute;
      right: -24px;
      bottom: -96px;
      width: 230px;
      height: 230px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 50%;
      box-shadow: 0 0 0 24px rgba(255,255,255,.035), 0 0 0 50px rgba(255,255,255,.035);
      content: "";
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #d3e2d5;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: clamp(29px, 7vw, 38px);
      letter-spacing: .04em;
    }

    .subtitle {
      position: relative;
      z-index: 1;
      margin: 9px 0 0;
      color: #e0ebe0;
      font-size: 14px;
    }

    .score {
      position: absolute;
      z-index: 1;
      top: 28px;
      right: 30px;
      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,.26);
      border-radius: 999px;
      color: white;
      font-size: 13px;
    }

    .score strong { margin-left: 5px; font-size: 16px; }

    .content { padding: 28px 34px 32px; }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat {
      padding: 17px 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fcfbf7;
    }

    .stat-label { color: var(--muted); font-size: 13px; }
    .stat-value { margin-top: 5px; font-size: 28px; font-weight: 750; }
    .stat-value small { margin-left: 3px; color: var(--muted); font-size: 14px; font-weight: 500; }

    .question {
      margin: 23px 0 18px;
      font-size: 16px;
      line-height: 1.8;
    }

    .question strong { color: var(--green-dark); }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field label {
      display: block;
      margin: 0 0 7px 2px;
      color: #526057;
      font-size: 13px;
      font-weight: 650;
    }

    .input-wrap { position: relative; }

    input {
      width: 100%;
      height: 54px;
      padding: 0 48px 0 16px;
      border: 1px solid #dedfd5;
      border-radius: 13px;
      outline: none;
      background: white;
      color: var(--ink);
      font-size: 20px;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(55, 107, 80, .12);
    }

    .unit {
      position: absolute;
      top: 50%;
      right: 15px;
      color: var(--muted);
      font-size: 14px;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 17px;
    }

    button {
      min-height: 48px;
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      transition: background .2s, transform .15s;
    }

    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid rgba(55, 107, 80, .28); outline-offset: 2px; }

    .primary {
      flex: 1;
      color: white;
      background: var(--green);
    }

    .primary:hover { background: var(--green-dark); }

    .secondary {
      color: var(--green-dark);
      background: var(--green-soft);
    }

    .secondary:hover { background: #dce9dc; }

    .feedback {
      min-height: 48px;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      color: var(--muted);
      background: #f7f6f1;
      font-size: 14px;
      line-height: 1.65;
    }

    .feedback.success { color: #28523c; background: #e8f3e8; }
    .feedback.error { color: #8c4e27; background: #fff1e5; }
    .feedback.hint { color: #53614c; background: #f1f3e9; }

    .footer {
      margin: 20px 0 0;
      color: #92988f;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 430px) {
      body { padding: 14px; }
      .top { padding: 25px 22px 23px; }
      .score { top: 24px; right: 20px; padding: 7px 10px; font-size: 12px; }
      .content { padding: 23px 21px 25px; }
      .stat { padding: 14px; }
      .stat-value { font-size: 25px; }
      .actions { flex-wrap: wrap; }
      .secondary { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="game">
    <header class="top">
      <p class="eyebrow">MATH · PUZZLE</p>
      <h1>鸡兔同笼</h1>
      <p class="subtitle">动动脑筋，找出鸡和兔各有几只</p>
      <div class="score" aria-label="答对题数">答对 <strong id="score">0</strong></div>
    </header>

    <section class="content" aria-label="游戏区域">
      <div class="stats" aria-live="polite">
        <div class="stat">
          <div class="stat-label">笼中共有</div>
          <div class="stat-value"><span id="heads">—</span><small>个头</small></div>
        </div>
        <div class="stat">
          <div class="stat-label">一共数出</div>
          <div class="stat-value"><span id="feet">—</span><small>只脚</small></div>
        </div>
      </div>

      <p class="question">笼子里关着鸡和兔。已知鸡有 <strong>2 只脚</strong>，兔有 <strong>4 只脚</strong>，请算一算：</p>

      <form id="answer-form">
        <div class="answers">
          <div class="field">
            <label for="chickens">鸡有几只？</label>
            <div class="input-wrap">
              <input id="chickens" name="chickens" type="number" min="0" step="1" inputmode="numeric" placeholder="输入数量" autocomplete="off">
              <span class="unit">只</span>
            </div>
          </div>
          <div class="field">
            <label for="rabbits">兔有几只？</label>
            <div class="input-wrap">
              <input id="rabbits" name="rabbits" type="number" min="0" step="1" inputmode="numeric" placeholder="输入数量" autocomplete="off">
              <span class="unit">只</span>
            </div>
          </div>
        </div>

        <div class="actions">
          <button class="primary" type="submit">提交答案</button>
          <button class="secondary" id="hint-button" type="button">给我提示</button>
          <button class="secondary" id="next-button" type="button">换一题 ↻</button>
        </div>
      </form>

      <div class="feedback" id="feedback" role="status" aria-live="polite">填好鸡和兔的数量，看看你能不能答对！</div>
      <p class="footer">小提示：先假设笼子里全是鸡，再看看脚数差了多少。</p>
    </section>
  </main>

  <script>
    (() => {
      const headsOutput = document.getElementById("heads");
      const feetOutput = document.getElementById("feet");
      const scoreOutput = document.getElementById("score");
      const form = document.getElementById("answer-form");
      const chickensInput = document.getElementById("chickens");
      const rabbitsInput = document.getElementById("rabbits");
      const feedback = document.getElementById("feedback");
      const hintButton = document.getElementById("hint-button");
      const nextButton = document.getElementById("next-button");
      let answer = { chickens: 0, rabbits: 0, heads: 0, feet: 0 };
      let score = 0;
      let solved = false;

      function setFeedback(message, kind = "") {
        feedback.textContent = message;
        feedback.className = `feedback${kind ? ` ${kind}` : ""}`;
      }

      function newQuestion() {
        const chickens = Math.floor(Math.random() * 9) + 2;
        const rabbits = Math.floor(Math.random() * 9) + 1;
        answer = {
          chickens,
          rabbits,
          heads: chickens + rabbits,
          feet: chickens * 2 + rabbits * 4
        };
        solved = false;
        headsOutput.textContent = answer.heads;
        feetOutput.textContent = answer.feet;
        chickensInput.value = "";
        rabbitsInput.value = "";
        setFeedback("填好鸡和兔的数量，看看你能不能答对！");
        chickensInput.focus();
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (solved) {
          setFeedback("这题已经答对啦，换一题继续挑战吧！", "success");
          return;
        }

        const chickens = Number(chickensInput.value);
        const rabbits = Number(rabbitsInput.value);
        if (chickensInput.value.trim() === "" || rabbitsInput.value.trim() === "") {
          setFeedback("鸡和兔的数量都要填写哦。", "error");
          return;
        }
        if (!Number.isInteger(chickens) || !Number.isInteger(rabbits) || chickens < 0 || rabbits < 0) {
          setFeedback("请输入不小于 0 的整数。", "error");
          return;
        }

        if (chickens === answer.chickens && rabbits === answer.rabbits) {
          solved = true;
          score += 1;
          scoreOutput.textContent = score;
          setFeedback(`答对啦！鸡有 ${answer.chickens} 只，兔有 ${answer.rabbits} 只。真棒！`, "success");
        } else if (chickens + rabbits !== answer.heads) {
          setFeedback(`数量不太对：鸡和兔加起来应该是 ${answer.heads} 只，再算算看。`, "error");
        } else if (chickens * 2 + rabbits * 4 !== answer.feet) {
          setFeedback(`脚数还没对上：按你的答案算出来是 ${chickens * 2 + rabbits * 4} 只脚，再试一次。`, "error");
        } else {
          setFeedback("答案不正确，再检查一下鸡和兔分别有几只。", "error");
        }
      });

      hintButton.addEventListener("click", () => {
        const extraFeet = answer.feet - answer.heads * 2;
        setFeedback(`先把每只动物都当成鸡：${answer.heads} 只共有 ${answer.heads * 2} 只脚。实际多出 ${extraFeet} 只脚，每只兔比鸡多 2 只脚，所以兔有 ${extraFeet} ÷ 2 = ${answer.rabbits} 只。`, "hint");
      });

      nextButton.addEventListener("click", newQuestion);
      newQuestion();
    })();
  </script>
</body>
</html>
